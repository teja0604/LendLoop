services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lendloop-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOST=localhost
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_DEFAULT_BINARY_DATA_MODE=default
      - N8N_METRICS=true
      - N8N_LOG_LEVEL=info
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - CONVEX_SITE_URL=${CONVEX_SITE_URL:-http://localhost:3000}
      - N8N_WEBHOOK_HMAC_SECRET=${N8N_WEBHOOK_HMAC_SECRET:-dev_hmac_secret_for_local_n8n}
      - SMTP_HOST=${SMTP_HOST:-smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-notifications@lendloop.org}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-smtp_password}
      - SMTP_SENDER_EMAIL=${SMTP_SENDER_EMAIL:-notifications@lendloop.org}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    driver: local
